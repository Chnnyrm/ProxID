[pytest]
# Environment for the suite comes from tests/conftest.py, which runs before anything
# imports app.
testpaths = tests
addopts = -q --strict-markers -p no:anchorpy
# anchorpy is a Solana package this project does not use and does not depend on. Its
# pytest plugin auto-loads from any environment that happens to have it installed and
# then fails on a missing dependency, so it is blocked by name.
