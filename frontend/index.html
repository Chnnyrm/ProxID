<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProxID - verified local work, nearby</title>
    <meta
      name="description"
      content="Post a job, find a nearby provider whose human proof is on chain, talk in the job room, and let the agent run the paperwork. Payments settle over x402 on Concordium."
    />
    <script>
      // Applied before first paint so a dark-mode visitor never sees a white flash.
      // The stored choice wins; the operating system preference is the fallback.
      (function () {
        try {
          var stored = localStorage.getItem('proxid-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
