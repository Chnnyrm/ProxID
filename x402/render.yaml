# Render blueprint. Point Render at this repository, and it will build the facilitator
# from x402/Dockerfile.
#
# The free instance sleeps after fifteen minutes idle and takes about fifty seconds to
# wake. That is fatal in front of a judge, so an uptime monitor must ping /health every
# ten minutes. UptimeRobot and cron-job.org both do this for free. Set it up and leave it
# running through the judging window; a sleeping facilitator during a demo is the same as
# no facilitator.
services:
  - type: web
    name: proxid-x402-facilitator
    runtime: docker
    dockerfilePath: ./x402/Dockerfile
    dockerContext: ./x402
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: X402_SPONSOR_ADDRESS
        sync: false
      - key: X402_SPONSOR_PRIVATE_KEY
        sync: false
      - key: CONCORDIUM_NETWORK_CAIP2
        value: ccd:4221332d34e1694168c2a0c0b3fd0f27
      - key: CONCORDIUM_GRPC
        value: grpc.testnet.concordium.com:20000
